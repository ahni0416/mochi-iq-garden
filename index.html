    <style>
      #root:has(.boot-help) { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f7f8ef; color: #284532; font-family: system-ui, sans-serif; }
      .boot-help { max-width: 520px; padding: 34px; border: 1px solid #e6eadf; border-radius: 22px; background: white; line-height: 1.6; box-shadow: 0 8px 30px #38543112; }
      .boot-help h1 { font-size: 26px; margin: 0 0 12px; }
      .boot-help p { color: #71816f; }
      .boot-help code { display: block; padding: 14px; border-radius: 10px; background: #f1f5eb; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-help">
        <h1>🐸 Mochi’s garden is getting ready…</h1>
        <p>If you opened this file directly, the game needs to be started through its local web server. In the project folder, run:</p>
        <code>npm install
npm run dev</code>
        <p>Then open the localhost link shown in Terminal. You can also double-click <strong>start-game.command</strong> on Mac.</p>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
